# ===========================================
# Digital Banking System - Application Config
# ===========================================

spring.application.name=digital-banking-system

# ===========================================
# Server Configuration
# ===========================================
server.port=8080

# ===========================================
# PostgreSQL Database Configuration
# ===========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/digitalbank
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234

# ===========================================
# JPA / Hibernate Configuration
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Hibernate dialect auto-detected from database connection

# ===========================================
# JWT Configuration
# ===========================================
app.jwt.secret=${JWT_SECRET:digitalBankingSecretKeyForJWTTokenGenerationAndValidation2025}
app.jwt.expiration=86400000

# ===========================================
# Thymeleaf Configuration
# ===========================================
spring.thymeleaf.cache=false

# ===========================================
# Logging Configuration
# ===========================================
logging.level.com.digitalbanking=DEBUG
logging.level.org.hibernate.SQL=DEBUG
